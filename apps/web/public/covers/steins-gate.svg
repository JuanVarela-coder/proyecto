<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0806"/>
      <stop offset="45%" stop-color="#1e150d"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#ff8c1a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#b34700" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  
  <!-- Time Gears Background -->
  <g stroke="#d97706" stroke-opacity="0.28" fill="none" stroke-width="3">
    <circle cx="300" cy="320" r="220" stroke-dasharray="18 10"/>
    <circle cx="300" cy="320" r="185"/>
    <circle cx="300" cy="320" r="140" stroke-dasharray="6 14"/>
    <circle cx="120" cy="160" r="95" stroke-dasharray="12 8"/>
    <circle cx="480" cy="470" r="110" stroke-dasharray="14 9"/>
    <line x1="300" y1="100" x2="300" y2="540"/>
    <line x1="80" y1="320" x2="520" y2="320"/>
    <line x1="145" y1="165" x2="455" y2="475"/>
    <line x1="455" y1="165" x2="145" y2="475"/>
  </g>

  <!-- Clock Hands -->
  <line x1="300" y1="320" x2="300" y2="155" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <line x1="300" y1="320" x2="425" y2="260" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <circle cx="300" cy="320" r="9" fill="#fbbf24"/>

  <!-- Silhouettes: Okabe (Lab Coat) & Kurisu -->
  <g fill="#0c0a09" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5">
    <!-- Okabe silhouette -->
    <path d="M160 720 L185 510 L215 465 L275 465 L310 520 L345 720 Z"/>
    <circle cx="245" cy="415" r="36"/>
    <!-- Spiky hair -->
    <path d="M210 405 L200 380 L225 385 L235 365 L255 382 L275 370 L280 398 Z" fill="#18120e" stroke="none"/>
    <!-- Kurisu silhouette -->
    <path d="M315 720 L335 535 L360 485 L415 485 L440 540 L460 720 Z"/>
    <circle cx="385" cy="435" r="32"/>
    <path d="M353 430 Q340 530 330 600 M417 430 Q435 530 445 600" stroke="#991b1b" stroke-width="8" fill="none" opacity="0.65"/>
  </g>

  <!-- Nixie Tube Divergence Meter -->
  <g transform="translate(75, 645)">
    <rect x="0" y="0" width="450" height="115" rx="10" fill="#14110f" stroke="#78350f" stroke-width="3"/>
    <!-- 8 Nixie Tubes -->
    <g fill="#1c1613" stroke="#92400e" stroke-width="1.5">
      <rect x="18" y="12" width="46" height="82" rx="22"/>
      <rect x="72" y="12" width="46" height="82" rx="22"/>
      <rect x="126" y="12" width="46" height="82" rx="22"/>
      <rect x="180" y="12" width="46" height="82" rx="22"/>
      <rect x="234" y="12" width="46" height="82" rx="22"/>
      <rect x="288" y="12" width="46" height="82" rx="22"/>
      <rect x="342" y="12" width="46" height="82" rx="22"/>
      <rect x="396" y="12" width="46" height="82" rx="22"/>
    </g>
    <text x="41" y="74" font-family="monospace" font-size="54" font-weight="bold" fill="#ff7b00" text-anchor="middle" filter="url(#neon)">1</text>
    <text x="95" y="74" font-family="monospace" font-size="54" font-weight="bold" fill="#ff7b00" text-anchor="middle" filter="url(#neon)">.</text>
    <text x="149" y="74" font-family="monospace" font-size="54" font-weight="bold" fill="#ff7b00" text-anchor="middle" filter="url(#neon)">0</text>
    <text x="203" y="74" font-family="monospace" font-size="54" font-weight="bold" fill="#ff7b00" text-anchor="middle" filter="url(#neon)">4</text>
    <text x="257" y="74" font-family="monospace" font-size="54" font-weight="bold" fill="#ff7b00" text-anchor="middle" filter="url(#neon)">8</text>
    <text x="311" y="74" font-family="monospace" font-size="54" font-weight="bold" fill="#ff7b00" text-anchor="middle" filter="url(#neon)">5</text>
    <text x="365" y="74" font-family="monospace" font-size="54" font-weight="bold" fill="#ff7b00" text-anchor="middle" filter="url(#neon)">9</text>
    <text x="419" y="74" font-family="monospace" font-size="54" font-weight="bold" fill="#ff7b00" text-anchor="middle" filter="url(#neon)">6</text>
  </g>

  <!-- Title Branding -->
  <text x="300" y="815" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#f5f5f4" letter-spacing="4" text-anchor="middle">STEINS;GATE</text>
  <text x="300" y="848" font-family="sans-serif" font-size="15" fill="#f59e0b" letter-spacing="6" text-anchor="middle">EL PSY KONGROO</text>
</svg>
server {
    listen 80;
    server_name localhost;

    location /hls {
        alias /usr/share/nginx/html/hls;
        
        # HLS MIME types
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # CORS Headers for web player (Next.js)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Origin, Content-Type, Accept' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Cache control for live / VOD streaming
        expires -1;
        add_header Cache-Control no-cache;
    }

    location /health {
        return 200 '{"status":"ok","service":"hls-nginx"}';
        add_header Content-Type application/json;
    }
}
